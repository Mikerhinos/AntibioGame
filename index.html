const SCORM = (function(){
  function findAPI(w){ let n=0; while(w.API==null&&w.parent&&w.parent!==w){w=w.parent;if(++n>7)break;} return w.API||null; }
  const api=findAPI(window); let inited=false; let terminated=false;
  return {
    init(){ if(!api||inited)return; api.LMSInitialize(''); inited=true; },
    reset(){ /* session reste ouverte entre les parties */ },
    finish(note){
      if(!api||terminated) return;
      this.init();
      api.LMSSetValue('cmi.core.score.raw',   String(Math.round(note)));
      api.LMSSetValue('cmi.core.score.min',   '0');
      api.LMSSetValue('cmi.core.score.max',   '100');
      api.LMSSetValue('cmi.core.lesson_status','completed');
      api.LMSCommit('');
    },
    terminate(){
      if(!api||terminated) return;
      terminated=true;
      try{ api.LMSCommit(''); api.LMSFinish(''); }catch(_){}
    }
  };
})();

/* ── Mise à l'échelle robuste ─────────────────────────────────────────
   Le root est positionné avec marginTop calculé depuis le haut de la
   fenêtre. body utilise justify-content:flex-start pour ne pas
   interférer. Le scale part de transform-origin:top center.
   ─────────────────────────────────────────────────────────────────── */
function applyScale(){
  const root = document.getElementById('root');
  const vw   = window.innerWidth;
  const vh   = window.innerHeight;
  const isFS = !!document.fullscreenElement;
  const cw   = canvas.width, ch = canvas.height;

  /* Mesure overhead HTML (tout sauf canvas) — après scale c'est * currentScale
     mais on calcule d'abord le scale, donc on itère :
     Simplification : on fait un overhead natif (sans scale) */
  let overheadNative = 0;
  for(const el of root.children){
    if(el === canvas) continue;
    const s = getComputedStyle(el);
    if(s.display === 'none') continue;
    overheadNative += el.offsetHeight
      + Math.max(0, parseFloat(s.marginTop   )||0)
      + Math.max(0, parseFloat(s.marginBottom)||0);
  }
  const gap = parseFloat(getComputedStyle(root).gap)||0;
  const nVis = [...root.children].filter(el=>getComputedStyle(el).display!=='none').length;
  overheadNative += gap * Math.max(0, nVis - 1);
  overheadNative = Math.max(overheadNative, 28);

  /* Hauteur totale native du root (canvas + overhead) */
  const totalNativeH = ch + overheadNative;

  /* Scale qui fait tenir le tout dans la fenêtre */
  const sx  = (vw - 6) / cw;
  const sy  = (vh - 6) / totalNativeH;
  const cap = isFS ? Math.min(sx, sy) : Math.min(sx, sy, 1.0);
  currentScale = Math.max(0.12, cap);

  root.style.transform       = `scale(${currentScale})`;
  root.style.transformOrigin = 'top center';

  /* Centrage vertical : l'élément rendu mesure totalNativeH * currentScale
     On veut que son centre soit au centre de la fenêtre            */
  const renderedH = totalNativeH * currentScale;
  const topMargin = Math.max(0, Math.round((vh - renderedH) / 2));
  root.style.marginTop = topMargin + 'px';
}
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ autoLayout(); }, 100); });

function toCanvasCoords(cx,cy){
  const r=canvas.getBoundingClientRect();
  // r.width/height = rendered size; canvas.width/height = logical size
  return {
    x:(cx-r.left)*(canvas.width /r.width),
    y:(cy-r.top) *(canvas.height/r.height)
  };
}

/* ════════════════════════════════════════════════

const AC = new (window.AudioContext || window.webkitAudioContext)();

// Nœuds maîtres
const sfxGain   = AC.createGain();
const masterOut = AC.createDynamicsCompressor();
sfxGain.connect(masterOut);
masterOut.connect(AC.destination);

let sfxVolume   = 0.8;
let musicVolume = 0.5;
sfxGain.gain.value = sfxVolume;

function resumeAC(){ return AC.state==='suspended' ? AC.resume() : Promise.resolve(); }

function playTone({ freq=440, type='sine', attack=.01, decay=.1, sustain=0,
                    release=.1, vol=.18, filter=0 } = {}){
  resumeAC();
  const osc=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  osc.type=type; osc.frequency.setValueAtTime(freq,t);
  if(filter){ const bq=AC.createBiquadFilter(); bq.type='lowpass'; bq.frequency.value=filter; osc.connect(bq); bq.connect(g); }
  else osc.connect(g);
  g.connect(sfxGain);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+attack);
  g.gain.setValueAtTime(vol*sustain,t+attack+decay);
  g.gain.linearRampToValueAtTime(0,t+attack+decay+release);
  osc.start(t); osc.stop(t+attack+decay+release+.05);
}

      vib.type='sine'; vib.frequency.value=7;
      vibG.gain.value=18; vib.connect(vibG); vibG.connect(osc.frequency);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.05);
      g.gain.linearRampToValueAtTime(0,t+.3);
      osc.connect(g); g.connect(sfxGain);
      osc.start(t); vib.start(t); osc.stop(t+.35); vib.stop(t+.35);

/* ════════════════════════════════════════════════
   §4  MUSIQUE PROCÉDURALE

   Gamme : do mineur pentatonique (2 octaves)
   Tempo : 90 → 175 BPM selon le temps restant
   Filtre passe-bas qui s'ouvre (sombre → brillant)
   Hi-hat et arpège entrent progressivement
   Scheduler sur setInterval (100 ms) + lookahead 0.4 s
   pour ne pas dépendre du RAF (robuste même onglet caché)
   ════════════════════════════════════════════════ */
const Music = (function(){
  const N = {
    c2:65.4, eb2:77.8, f2:87.3, g2:98.0,  bb2:116.5,
    c3:130.8,eb3:155.6,f3:174.6,g3:196.0, bb3:233.1,
    c4:261.6,eb4:311.1,f4:349.2,g4:392.0, bb4:466.2
  };
  const BASS = ['c2','c2','g2','eb2','f2','f2','bb2','g2'];
  const ARP  = ['g3','eb3','c4','bb3','g3','eb4','bb3','g3',
                'c4','g3','f3','eb3','c3','g3','eb4','bb3'];

  let mg=null, filt=null, arpG=null;
  let playing=false, nextBeat=0, beatIdx=0;
  let intervalId=null;
  const LOOKAHEAD = 0.40; // secondes d'avance programmées

  /* Crée le graphe audio une seule fois */
  function ensureNodes(){
    if(mg) return;
    mg   = AC.createGain();  mg.gain.value = 0;
    filt = AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=600;
    arpG = AC.createGain();  arpG.gain.value = 0;
    mg.connect(filt); filt.connect(masterOut);
    arpG.connect(mg);
  }

  function schedNote(freq, t, dur, vol, type, dest){
    const osc=AC.createOscillator(), g=AC.createGain();
    osc.type=type||'triangle'; osc.frequency.value=freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+Math.max(dur, 0.05));
    osc.connect(g); g.connect(dest||mg);
    osc.start(t); osc.stop(t+dur+0.06);
  }

  function schedKick(t, vol){
    const osc=AC.createOscillator(), g=AC.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(90,t);
    osc.frequency.exponentialRampToValueAtTime(30, t+0.10);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
    osc.connect(g); g.connect(mg);
    osc.start(t); osc.stop(t+0.20);
  }

  function schedHihat(t, vol){
    const len=0.045, sr=AC.sampleRate;
    const buf=AC.createBuffer(1, Math.ceil(sr*len), sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf;
    const hpf=AC.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=7000;
    const g=AC.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+len);
    src.connect(hpf); hpf.connect(g); g.connect(mg);
    src.start(t); src.stop(t+len+0.02);
  }

  function scheduleBeat(t, idx, p, spb){
    schedNote(N[BASS[idx%8]], t, spb*0.55, 0.5, 'triangle'); // basse
    if(idx%4===0) schedKick(t, 0.6+p*0.3);                   // kick
    if(p>0.05){
      schedNote(N[ARP[(idx*2)   %16]], t,          spb*0.3, 0.3, 'sine', arpG);
      schedNote(N[ARP[(idx*2+1) %16]], t+spb*0.5,  spb*0.3, 0.25,'sine', arpG);
    }
    if(p>0.30) schedHihat(t, 0.18+p*0.10);
    if(p>0.60) schedHihat(t+spb*0.5, 0.12+p*0.08);
    if(p>0.82){ schedHihat(t+spb*0.25, 0.10); schedHihat(t+spb*0.75, 0.10); }
  }

  /* Mis à jour du volume/filtre selon la progression */
  let currentP = 0;
  function applyMood(){
    if(!mg || !playing) return;
    const targetVol = musicVolume * (1.0 + currentP*0.35); // 1.0→1.35 × musicVolume
    mg.gain.setTargetAtTime(targetVol, AC.currentTime, 0.8);
    filt.frequency.setTargetAtTime(600 + currentP*3400, AC.currentTime, 1.0);
    arpG.gain.setTargetAtTime(currentP>0.05 ? 1 : 0, AC.currentTime, 0.4);
  }

  /* Scheduler : appelé toutes les 100 ms par setInterval */
  function runScheduler(){
    if(!playing || !mg) return;
    const p   = currentP;
    const bpm = 90 + p*85;
    const spb = 60/bpm;
    while(nextBeat < AC.currentTime + LOOKAHEAD){
      scheduleBeat(nextBeat, beatIdx, p, spb);
      beatIdx++;
      nextBeat += spb;
    }
    applyMood();
  }

  return {
    start(){
      ensureNodes();
      resumeAC().then(()=>{
        playing  = true;
        beatIdx  = 0;
        currentP = 0;
        nextBeat = AC.currentTime + 0.05;
        /* Volume de départ non-nul immédiatement */
        mg.gain.cancelScheduledValues(AC.currentTime);
        mg.gain.setValueAtTime(musicVolume*1.0, AC.currentTime);
        filt.frequency.setValueAtTime(600, AC.currentTime);
        arpG.gain.setValueAtTime(0, AC.currentTime);
        /* Pré-remplir 2 mesures dès le départ */
        const initSpb = 60/90;
        for(let b=0; b<8; b++){
          scheduleBeat(nextBeat + b*initSpb, b, 0, initSpb);
        }
        beatIdx  = 8;
        nextBeat += 8*initSpb;
        /* Scheduler récurrent toutes les 100 ms */
        if(intervalId) clearInterval(intervalId);
        intervalId = setInterval(runScheduler, 100);
      });
    },

    tick(remaining, total){
      /* Appelé par tickTimer() — met à jour currentP pour le scheduler */
      currentP = Math.max(0, Math.min(1, 1 - remaining/total));
    },

    stop(){
      playing = false;
      if(intervalId){ clearInterval(intervalId); intervalId=null; }
      if(mg) mg.gain.setTargetAtTime(0, AC.currentTime, 0.5);
    },

    setVolume(v){
      musicVolume = v;
      if(mg && playing) applyMood();
    }
  };
})();

function computeLayout(mode){

  canvas.width=CANVAS_W; canvas.height=CANVAS_H;

}

function drawCharacter(cx,cy,mood,size){
  ctx.save(); ctx.translate(cx,cy);
  const r=44*size, phi=frameTime*.018;
  for(let i=0;i<6;i++){
    const ba=(i/6)*Math.PI*2+phi*.4, pL=r*(.45+.12*Math.sin(phi+i*1.3));
    const px=Math.cos(ba)*(r*.9+pL), py=Math.sin(ba)*(r*.9+pL);
    ctx.beginPath(); ctx.moveTo(Math.cos(ba)*r*.65, Math.sin(ba)*r*.65);
    ctx.quadraticCurveTo(Math.cos(ba+.35)*r*1.1, Math.sin(ba+.35)*r*1.1, px, py);
    ctx.strokeStyle='rgba(100,180,230,.32)'; ctx.lineWidth=9*size; ctx.lineCap='round'; ctx.stroke();
  }
  ctx.shadowColor='#4fc3f7'; ctx.shadowBlur=16*size;
  const bg=ctx.createRadialGradient(-r*.22,-r*.28,0,0,0,r);
  bg.addColorStop(0,'#e8f4ff'); bg.addColorStop(.6,'#9ec8e8'); bg.addColorStop(1,'#5a9bbe');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(80,170,220,.5)'; ctx.lineWidth=1.6*size; ctx.stroke();
  ctx.fillStyle='rgba(60,120,190,.3)'; ctx.beginPath(); ctx.ellipse(r*.1,r*.12,r*.32,r*.25,.3,0,Math.PI*2); ctx.fill();
  const eY=-r*.18, eS=r*.22;
  ctx.fillStyle='#1a3a5a';
  if(mood==='tickle'){
    /* Yeux plissés en trait ondulé */
    ctx.strokeStyle='#1a3a5a'; ctx.lineWidth=2.4*size; ctx.lineCap='round';
    [-eS,eS].forEach(ex=>{
      ctx.beginPath();
      ctx.moveTo(ex-r*.12,eY); ctx.quadraticCurveTo(ex,eY+r*.13,ex+r*.12,eY);
      ctx.stroke();
    });
    /* Joues encore plus roses */
    ctx.fillStyle='rgba(255,100,100,.42)';
    ctx.beginPath();ctx.arc(-eS-r*.06,eY+r*.26,r*.16,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( eS+r*.06,eY+r*.26,r*.16,0,Math.PI*2);ctx.fill();
  } else if(mood==='sad'){
    ctx.strokeStyle='#1a3a5a'; ctx.lineWidth=2.6*size; ctx.lineCap='round';
    [-eS,eS].forEach(ex=>{ctx.beginPath();ctx.arc(ex,eY+r*.1,r*.11,0,Math.PI);ctx.stroke();});
    ctx.fillStyle='rgba(100,190,255,.7)';
    [-eS,eS].forEach(ex=>{ctx.beginPath();ctx.ellipse(ex,eY+r*.3,3*size,7*size,0,0,Math.PI*2);ctx.fill();});
  } else if(mood==='happy'){
    ctx.strokeStyle='#1a3a5a'; ctx.lineWidth=2.6*size;
    [-eS,eS].forEach(ex=>{ctx.beginPath();ctx.arc(ex,eY,r*.12,Math.PI,0);ctx.stroke();});
    ctx.fillStyle='rgba(255,140,130,.32)';
    ctx.beginPath();ctx.arc(-eS-r*.05,eY+r*.22,r*.13,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(eS+r*.05,eY+r*.22,r*.13,0,Math.PI*2);ctx.fill();
  } else {
    [-eS,eS].forEach(ex=>{
      ctx.fillStyle='#1a3a5a'; ctx.beginPath(); ctx.arc(ex,eY,r*.11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.65)'; ctx.beginPath(); ctx.arc(ex-r*.03,eY-r*.04,r*.04,0,Math.PI*2); ctx.fill();
    });
    if(mood==='alert'){
      ctx.strokeStyle='#1a3a5a'; ctx.lineWidth=2*size;
      ctx.beginPath();ctx.moveTo(-eS-r*.12,eY-r*.2);ctx.lineTo(-eS+r*.08,eY-r*.14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(eS+r*.12,eY-r*.2);ctx.lineTo(eS-r*.08,eY-r*.14);ctx.stroke();
    }
  }
  const mY=r*.25; ctx.strokeStyle='#1a3a5a'; ctx.lineWidth=2.4*size; ctx.lineCap='round'; ctx.beginPath();
  if(mood==='tickle'){
    ctx.arc(0,mY-r*.04,r*.28,0,Math.PI); ctx.stroke();
    ctx.fillStyle='rgba(20,10,30,.25)';
    ctx.beginPath(); ctx.arc(0,mY-r*.04,r*.28,0,Math.PI); ctx.fill();
  } else if(mood==='happy')      {ctx.moveTo(-r*.3,mY);ctx.quadraticCurveTo(0,mY+r*.25,r*.3,mY);ctx.stroke();}
  else if(mood==='sad')   {ctx.moveTo(-r*.28,mY+r*.14);ctx.quadraticCurveTo(0,mY-r*.08,r*.28,mY+r*.14);ctx.stroke();}
  else                    {ctx.moveTo(-r*.2,mY);ctx.quadraticCurveTo(0,mY+r*.08,r*.2,mY);ctx.stroke();}
  const bx=r*.52, by2=r*.54, cs=5.5*size;
  ctx.fillStyle='#ef5350'; ctx.fillRect(bx-cs,by2-cs*.4,cs*2,cs*.8); ctx.fillRect(bx-cs*.4,by2-cs,cs*.8,cs*2);
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(-r*.24,-r*.3,r*.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  /* Mémorise la zone de clic du personnage (cercle → rect englobant) */
  charLastRect = { x:cx-r*1.5, y:cy-r*1.5, w:r*3, h:r*3 };
}

/* ════════════════════════════════════════════════
   §9  BACTÉRIE
   ════════════════════════════════════════════════ */
class Bacteria{
  constructor(){
    let x,y;
    do{x=BX+R_BACT*2+Math.random()*(BW-R_BACT*4);y=BY+R_BACT*2+Math.random()*(BH-R_BACT*4);}
    while(Math.hypot(x-CX,y-CY)<SAFE_ZONE);
    this.x=x; this.y=y; this.ci=Math.floor(Math.random()*N_COLORS);
    const spd=bactSpeedMin()+Math.random()*(bactSpeedMax()-bactSpeedMin());
    const ang=Math.random()*Math.PI*2;
    this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
    this.dirTimer=BACT_DIR_MIN+Math.random()*(BACT_DIR_MAX-BACT_DIR_MIN);
    this.resistances=[]; this.alive=true; this.dyingT=0; this.phi=Math.random()*Math.PI*2;
    this.absorbFlash=0; this.transmitFlash=0; this.contactCD=0; this.isPanResistant=false;
    // Forme aléatoire : 0=sphère, 1=bâtonnet, 2=haricot
    this.shape = Math.floor(Math.random()*3);
    this.shapeAng = Math.random()*Math.PI*2; // orientation initiale
    // Rotation sur elle-même : plus lente pour les sphères, plus marquée pour les autres
    const rotMult={easy:.7,normal:1.0,hard:1.5}[difficulty]||1.0;
    this.rotSpeed = (Math.random()-0.5) * (this.shape===0 ? 0.008 : 0.022) * rotMult;
  }
  addResistance(ci){
    this.resistances.push(ci);
    // Pan-résistante si ≥4 couleurs DIFFÉRENTES de la couleur native de la bactérie
    const foreignColors = new Set(this.resistances.filter(r=>r!==this.ci));
    if(foreignColors.size>=4) this.isPanResistant=true;
  }
  absorb(ci){ this.addResistance(ci); this.absorbFlash=1; }
  update(){
    this.phi+=.022;
    if(!this.alive){ this.dyingT=Math.min(1,this.dyingT+.055); return; }
    if(--this.dirTimer<=0){
      const spd=bactSpeedMin()+Math.random()*(bactSpeedMax()-bactSpeedMin());
      const ang=Math.random()*Math.PI*2;
      this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
      this.dirTimer=BACT_DIR_MIN+Math.random()*(BACT_DIR_MAX-BACT_DIR_MIN);
    }
    const dc=Math.hypot(this.x-CX,this.y-CY);
    if(dc<CENTER_REPEL_R){ const a=Math.atan2(this.y-CY,this.x-CX); this.vx+=Math.cos(a)*CENTER_REPEL_F; this.vy+=Math.sin(a)*CENTER_REPEL_F; }
    const spd=Math.hypot(this.vx,this.vy);
    if(spd>bactSpeedMax()*1.5){ this.vx=(this.vx/spd)*bactSpeedMax(); this.vy=(this.vy/spd)*bactSpeedMax(); }
    this.x+=this.vx; this.y+=this.vy;
    if(this.x-R_BACT<BX){this.x=BX+R_BACT;this.vx=Math.abs(this.vx);}
    if(this.x+R_BACT>BR){this.x=BR-R_BACT;this.vx=-Math.abs(this.vx);}
    if(this.y-R_BACT<BY){this.y=BY+R_BACT;this.vy=Math.abs(this.vy);}
    if(this.y+R_BACT>BB){this.y=BB-R_BACT;this.vy=-Math.abs(this.vy);}
    if(this.contactCD>0) this.contactCD--;
    this.shapeAng += this.rotSpeed; // rotation sur elle-même
    if(this.absorbFlash>0)   this.absorbFlash   = Math.max(0,this.absorbFlash  -.055);
    if(this.transmitFlash>0) this.transmitFlash = Math.max(0,this.transmitFlash-.032);
  }
  get done(){ return !this.alive && this.dyingT>=1; }
}

/* ════════════════════════════════════════════════
   §10  INTERACTIONS BACTÉRIES
   ════════════════════════════════════════════════ */
function bacteriaBacteriaInteractions(){
  for(let i=0;i<bacteria.length;i++){
    const a=bacteria[i]; if(!a.alive) continue;
    for(let j=i+1;j<bacteria.length;j++){
      const b=bacteria[j]; if(!b.alive) continue;
      const dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy), minD=R_BACT*2+1;
      if(dist<minD && dist>.1){
        const nx=dx/dist, ny=dy/dist, ov=(minD-dist)*.5;
        a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
        const dvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(dvn<0){ a.vx+=dvn*nx; a.vy+=dvn*ny; b.vx-=dvn*nx; b.vy-=dvn*ny; }
        [a,b].forEach(e=>{ e.x=Math.max(BX+R_BACT,Math.min(BR-R_BACT,e.x)); e.y=Math.max(BY+R_BACT,Math.min(BB-R_BACT,e.y)); });
        if(a.contactCD<=0 && b.contactCD<=0){
          const aU=new Set(a.resistances), bU=new Set(b.resistances);
          const aToB=[...aU].filter(r=>!bU.has(r)), bToA=[...bU].filter(r=>!aU.has(r));
          if(aToB.length||bToA.length){
            aToB.forEach(r=>{ b.addResistance(r); score=Math.max(0,score-DIFF_CONFIG[difficulty].resistPenalty); });
            bToA.forEach(r=>{ a.addResistance(r); score=Math.max(0,score-DIFF_CONFIG[difficulty].resistPenalty); });
            a.contactCD=CONTACT_COOLDOWN; b.contactCD=CONTACT_COOLDOWN;
            if(aToB.length) b.transmitFlash=1;
            if(bToA.length) a.transmitFlash=1;
            const mx=(a.x+b.x)*.5, my=(a.y+b.y)*.5;
            const n=aToB.length+bToA.length;
            burst(mx,my,'#00e5ff',10);
            addFloat(mx, my-R_BACT-14, '⚡ Résistance transmise !', '#00e5ff');
            addFloat(mx, my-R_BACT-34, `-${n*DIFF_CONFIG[difficulty].resistPenalty}`, '#ef5350');
            SFX.resistTransmit();
          }
        }
      }
    }
  }
}

/* ════════════════════════════════════════════════
   §11  PROJECTILE
   ════════════════════════════════════════════════ */
class Projectile{
  constructor(x,y,angle,ci){
    this.x=x; this.y=y;
    this.vx=Math.cos(angle)*PROJ_SPEED; this.vy=Math.sin(angle)*PROJ_SPEED;
    this.ci=ci; this.bounces=0; this.alive=true; this.trail=[];
  }
  update(){
    if(!this.alive) return;
    this.trail.push({x:this.x,y:this.y}); if(this.trail.length>20) this.trail.shift();
    this.x+=this.vx; this.y+=this.vy;
    let wh=false;
    if(this.x-R_PROJ<BX){this.x=BX+R_PROJ;this.vx=Math.abs(this.vx);wh=true;}
    if(this.x+R_PROJ>BR){this.x=BR-R_PROJ;this.vx=-Math.abs(this.vx);wh=true;}
    if(this.y-R_PROJ<BY){this.y=BY+R_PROJ;this.vy=Math.abs(this.vy);wh=true;}
    if(this.y+R_PROJ>BB){this.y=BB-R_PROJ;this.vy=-Math.abs(this.vy);wh=true;}
    if(wh){ this.bounces++; SFX.wallBounce(); burst(this.x,this.y,PAL[this.ci][0],5); if(this.bounces>MAX_WALL_BOUNCES){this.alive=false;return;} }
    for(const b of bacteria){
      if(!b.alive) continue;
      if(Math.hypot(this.x-b.x,this.y-b.y)<R_PROJ+R_BACT){
        if(b.ci===this.ci){
          b.alive=false;
          const killScore = Math.round((100+this.bounces*50) * DIFF_CONFIG[difficulty].multi);
          score += killScore;
          burst(b.x,b.y,PAL[b.ci][0],28);
          addFloat(b.x,b.y-R_BACT-10,`+${killScore}`,'#fff');
          SFX.destroy();
          announce(`Bactérie ${PAL[b.ci][2]} éliminée. Score : ${score}`);
        } else {
          b.absorb(this.ci); burst(b.x,b.y,PAL[this.ci][0],10);
          score=Math.max(0,score-DIFF_CONFIG[difficulty].resistPenalty);
          addFloat(b.x,b.y-R_BACT-10,'🦠 Résistance acquise !',PAL[this.ci][0]);
          addFloat(b.x,b.y-R_BACT-30,`-${DIFF_CONFIG[difficulty].resistPenalty}`,'#ef5350');
          SFX.resistAcquired();
          if(b.isPanResistant) setTimeout(()=>triggerGameOver('superbug'),300);
        }
        this.alive=false; break;
      }
    }
  }
}

/* ════════════════════════════════════════════════
   §12  PARTICULES
   ════════════════════════════════════════════════ */
function burst(x,y,color,n){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=1.5+Math.random()*4; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1,r:1.5+Math.random()*3}); }
}
function tickParticles(){
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vx*=.89; p.vy*=.89; p.life-=.027; }
  particles=particles.filter(p=>p.life>0);
}

/* ════════════════════════════════════════════════
   §13  TRAJECTOIRE
   ════════════════════════════════════════════════ */
function calcTraj(ox,oy,angle){
  let x=ox,y=oy,vx=Math.cos(angle),vy=Math.sin(angle);
  const segments=[],kpts=[{x,y}],alive=bacteria.filter(b=>b.alive);
  let wc=0;
  while(wc<=PREVIEW_MAX_WALL){
    let tMin=Infinity,hType=null,hBact=null;
    if(vx<-1e-9){const t=(BX+R_PROJ-x)/vx;if(t>1e-6&&t<tMin){tMin=t;hType='L';}}
    if(vx> 1e-9){const t=(BR-R_PROJ-x)/vx;if(t>1e-6&&t<tMin){tMin=t;hType='R';}}
    if(vy<-1e-9){const t=(BY+R_PROJ-y)/vy;if(t>1e-6&&t<tMin){tMin=t;hType='T';}}
    if(vy> 1e-9){const t=(BB-R_PROJ-y)/vy;if(t>1e-6&&t<tMin){tMin=t;hType='B';}}
    for(const b of alive){
      const dx=x-b.x,dy=y-b.y,R=R_PROJ+R_BACT,bq=dx*vx+dy*vy,cq=dx*dx+dy*dy-R*R,disc=bq*bq-cq;
      if(disc>=0){const t=-bq-Math.sqrt(disc);if(t>.01&&t<tMin){tMin=t;hType='C';hBact=b;}}
    }
    if(tMin===Infinity||tMin>1400) break;
    const ix=x+vx*tMin,iy=y+vy*tMin;
    segments.push({x1:x,y1:y,x2:ix,y2:iy});
    if(hType==='C'){kpts.push({x:ix,y:iy,type:hBact.ci===selCol?'hit':'stuck'});break;}
    else{if(hType==='L'||hType==='R')vx=-vx;else vy=-vy;kpts.push({x:ix,y:iy,type:'wall'});wc++;x=ix;y=iy;}
  }
  return{segments,kpts};
}

function lighten(hex,amt){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgb(${Math.min(255,r+Math.round(255*amt))},${Math.min(255,g+Math.round(255*amt))},${Math.min(255,b+Math.round(255*amt))})`; }
function formatTime(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
const pointInRect=(x,y,r)=>r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;

/* Dessin d'un bouton réutilisable sur canvas */
function canvasBtn(id,label,x,y,w,h,{primary=false,disabled=false}={}){
  const col  = primary ? '#4caf50' : '#00e5ff';
  const aDim = disabled ? .3 : 1;
  ctx.save(); ctx.globalAlpha=aDim;
  ctx.shadowColor=col; ctx.shadowBlur=primary?16:10;
  ctx.strokeStyle=col; ctx.lineWidth=primary?2:1.5; ctx.strokeRect(x,y,w,h);
  ctx.shadowBlur=0;
  ctx.fillStyle=`rgba(${primary?'76,175,80':'0,229,255'},.1)`; ctx.fillRect(x,y,w,h);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${fs(13)}px Orbitron`; ctx.fillStyle=col;
  ctx.shadowColor=col; ctx.shadowBlur=6; ctx.fillText(label,x+w/2,y+h/2+1); ctx.shadowBlur=0;
  ctx.restore();
  rects[id]={x,y,w,h};
}

/* Wrap de texte */
function wrapText(text,x,y,maxW,lh){
  const words=text.split(' '); let line='';
  for(let i=0;i<words.length;i++){
    const t=line+words[i]+' ';
    if(ctx.measureText(t).width>maxW&&i>0){ ctx.fillText(line,x,y); line=words[i]+' '; y+=lh; }
    else line=t;
  }
  ctx.fillText(line,x,y);
}

/* Orbes de résistance à l'INTÉRIEUR de la bactérie.
   Appelé APRÈS le dessin du corps (clip circulaire actif). */
function drawResistanceOrbs(b, r){
  const unique = [...new Set(b.resistances)];
  if(!unique.length) return;
  const n = unique.length;
  unique.forEach((ci, i)=>{
    const count = b.resistances.filter(x=>x===ci).length;
    /* Position en étoile à l'intérieur — rayon ≤ r*0.55 */
    const ang  = (i/n)*Math.PI*2 + b.phi*.5;
    const dist = r * (n===1 ? 0 : 0.42 + (n>3 ? 0 : 0));
    const ox   = Math.cos(ang)*dist;
    const oy   = Math.sin(ang)*dist;
    const rs   = Math.min(ORB_RADIUS, r*0.32);  // orbe qui tient dans le corps
    const rcol = PAL[ci][0];

    /* Halo intérieur doux */
    ctx.shadowColor = rcol; ctx.shadowBlur = rs*1.8;
    ctx.fillStyle   = rcol;
    ctx.beginPath(); ctx.arc(ox, oy, rs, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur  = 0;
    /* Reflet */
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(ox-rs*.3, oy-rs*.35, rs*.38, 0, Math.PI*2); ctx.fill();
    /* Compteur si résistance multiple */
    if(count > 1){
      ctx.font = `bold ${fs(6)}px "Share Tech Mono"`;
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(count, ox, oy+1);
    }
  });
  /* Halo rouge tournant si pan-résistante — au bord intérieur */
  if(b.isPanResistant){
    ctx.save();
    ctx.shadowColor = '#f44336'; ctx.shadowBlur = 14;
    ctx.strokeStyle = 'rgba(244,67,54,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r*.72, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

/* Flagelles d'une bactérie — dessinées AVANT le corps */
function drawFlagella(b, r){
  const col = PAL[b.ci][0];
  // Couleur semi-transparente extraite du hex proprement
  const rc = parseInt(col.slice(1,3),16);
  const gc = parseInt(col.slice(3,5),16);
  const bc2= parseInt(col.slice(5,7),16);
  const flagCol = `rgba(${Math.min(255,rc+40)},${Math.min(255,gc+40)},${Math.min(255,bc2+40)},0.7)`;

  const nFlagella = 10;
  for(let i=0; i<nFlagella; i++){
    const baseAng = (i/nFlagella)*Math.PI*2 + b.phi*.18;
    // Départ adapté à la forme (semi-axes réels de l'ellipse après rotation du corps)
    // On projette le vecteur directeur sur les axes de l'ellipse pour trouver le bord
    const bodyAng = b.shapeAng;
    const cosB=Math.cos(bodyAng), sinB=Math.sin(bodyAng);
    // Semi-axes selon la forme
    const semiA = b.shape===0?r:(b.shape===1?r*1.3:r*1.1); // demi-longueur
    const semiB2= b.shape===0?r:(b.shape===1?r*0.48:r*0.55); // demi-largeur
    // Coordonnées du vecteur baseAng dans le repère local de l'ellipse
    const localX = Math.cos(baseAng)*cosB + Math.sin(baseAng)*sinB;
    const localY =-Math.cos(baseAng)*sinB + Math.sin(baseAng)*cosB;
    // Rayon de l'ellipse dans cette direction
    const ellR = (semiA*semiB2)/Math.sqrt((semiB2*localX)**2+(semiA*localY)**2);
    const ax = Math.cos(baseAng)*ellR, ay = Math.sin(baseAng)*ellR;
    const len = r*(0.75 + .2*Math.sin(b.phi*2.2 + i*1.3));
    const waves = 1.6;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    const steps = 18;
    for(let s=1; s<=steps; s++){
      const t        = s/steps;
      const perp     = Math.cos(baseAng + Math.PI/2);
      const perpY    = Math.sin(baseAng + Math.PI/2);
      const waveAmp  = r*.10 * Math.sin(t*Math.PI);
      const wave     = Math.sin(t*Math.PI*2*waves + b.phi*4.0 + i*0.9) * waveAmp;
      ctx.lineTo(
        ax + Math.cos(baseAng)*t*len + perp*wave,
        ay + Math.sin(baseAng)*t*len + perpY*wave
      );
    }
    // Épaisseur décroissante de la base vers la pointe
    ctx.strokeStyle = flagCol;
    ctx.lineWidth   = 1.2;  // fin comme de vrais flagelles
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.stroke();
  }
}

function drawBacteria(){
  for(const b of bacteria){
    if(b.done) continue;
    const a  = b.alive ? 1 : (1-b.dyingT);
    const sc = b.alive ? (1+.06*Math.sin(b.phi)) : (1+b.dyingT*.9);
    const r  = R_BACT*sc;
    const col = PAL[b.ci][0];

    ctx.save(); ctx.globalAlpha = a; ctx.translate(b.x, b.y);

    /* Flashs de transmission / absorption */
    if(b.transmitFlash>0){ctx.save();ctx.globalAlpha=b.transmitFlash*.8;ctx.shadowColor='#00e5ff';ctx.shadowBlur=22;ctx.strokeStyle='#00e5ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,r+15,0,Math.PI*2);ctx.stroke();ctx.restore();}
    if(b.absorbFlash>0){ctx.save();ctx.globalAlpha=Math.sin(b.absorbFlash*Math.PI)*.7;ctx.shadowColor='#fff';ctx.shadowBlur=20;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r+6,0,Math.PI*2);ctx.fill();ctx.restore();}

    /* ── Flagelles (derrière le corps) ── */
    if(b.alive) drawFlagella(b, r);

    /* ── Corps : forme selon b.shape ── */
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    const gr = ctx.createRadialGradient(-r*.3,-r*.35,0, 0,0,r);
    gr.addColorStop(0, lighten(col,.45)); gr.addColorStop(.6, col); gr.addColorStop(1, PAL[b.ci][1]);
    ctx.fillStyle = gr;

    ctx.save();
    ctx.rotate(b.shapeAng);  // orientation du corps
    ctx.beginPath();
    if(b.shape===0){
      // Sphère
      ctx.arc(0,0,r,0,Math.PI*2);
    } else if(b.shape===1){
      // Bâtonnet : ellipse allongée (x2 en longueur)
      ctx.ellipse(0,0, r*1.3, r*0.48, 0, 0, Math.PI*2);
    } else {
      // Haricot : ellipse légèrement asymétrique + courbure
      ctx.ellipse(0, -r*.09, r*1.1, r*0.55, 0, 0, Math.PI*2);
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = lighten(col,.25); ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();

    /* ── Orbes de résistance à l'intérieur (clip sur la forme du corps) ── */
    ctx.save();
    ctx.rotate(b.shapeAng);
    ctx.beginPath();
    if(b.shape===0)      ctx.arc(0,0,r*.93,0,Math.PI*2);
    else if(b.shape===1) ctx.ellipse(0,0,r*1.2,r*0.42,0,0,Math.PI*2);
    else                 ctx.ellipse(0,-r*.09,r*1.0,r*0.50,0,0,Math.PI*2);
    ctx.clip();
    ctx.rotate(-b.shapeAng); // annuler la rotation pour les orbes
    drawResistanceOrbs(b, r);
    ctx.restore();

    /* Reflet spéculaire + noyau */
    ctx.save(); ctx.rotate(b.shapeAng);
    const rxR = b.shape===0?r*.27:(b.shape===1?r*.22:r*.24);
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.arc(-r*.28,-r*.3, rxR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.arc(0,0, r*.18, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }
}

function drawParticles(){ for(const p of particles){ ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.shadowColor=p.color; ctx.shadowBlur=6; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill(); ctx.restore(); } }

function drawTrajectory(){
  if(gameState!==STATE.PLAYING) return;
  const angle=Math.atan2(mouseY-CY,mouseX-CX);
  const ox=CX+Math.cos(angle)*(R_CANON+L_CANON+6), oy=CY+Math.sin(angle)*(R_CANON+L_CANON+6);
  const{segments,kpts}=calcTraj(ox,oy,angle);
  const col=PAL[selCol][0], dash=(Date.now()*.04)%11;
  segments.forEach((seg,i)=>{ ctx.save(); ctx.globalAlpha=Math.max(.08,.55-i*.15); ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.setLineDash([5,6]); ctx.lineDashOffset=-dash; ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke(); ctx.restore(); });
  ctx.setLineDash([]);
  for(let i=1;i<kpts.length;i++){
    const kp=kpts[i]; ctx.save(); ctx.globalAlpha=.85;
    if(kp.type==='hit'){ctx.shadowColor='#4caf50';ctx.shadowBlur=14;ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(kp.x,kp.y,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();}
    else if(kp.type==='stuck'){ctx.shadowColor='#ef5350';ctx.shadowBlur=10;ctx.strokeStyle='#ef5350';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(kp.x-5,kp.y-5);ctx.lineTo(kp.x+5,kp.y+5);ctx.moveTo(kp.x+5,kp.y-5);ctx.lineTo(kp.x-5,kp.y+5);ctx.stroke();}
    else{ctx.shadowColor=col;ctx.shadowBlur=8;ctx.translate(kp.x,kp.y);ctx.rotate(Math.PI/4);ctx.fillStyle=col;ctx.beginPath();ctx.rect(-4,-4,8,8);ctx.fill();}
    ctx.restore();
  }
}

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${fs(TXT.gameTitle)}px Orbitron`; ctx.fillStyle='#00e5ff';
  ctx.shadowColor='#00e5ff'; ctx.shadowBlur=14;
  ctx.fillText('COMMENT JOUER', isLS?rulesW/2:CANVAS_W/2, rulesY0+fs(28)); ctx.shadowBlur=0;
  ctx.strokeStyle='#0e2a3a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(rulesX, rulesY0+fs(50)); ctx.lineTo(isLS?rulesW:CANVAS_W-rulesX, rulesY0+fs(50)); ctx.stroke();

  /* Règles — zone scrollable si le contenu dépasse */
  const padV   = fs(10);
  const lH     = fs(15)*2 + fs(18) + padV*2 + fs(6); // hauteur fixe par règle
  const listY0 = rulesY0+fs(54);                       // Y de départ de la liste
  const listH  = rulesYB - listY0 - (isLS ? fs(60) : 0); // hauteur visible
  const totalH = lH * RULES.length;
  // Clamp scroll
  introScrollY = Math.max(0, Math.min(introScrollY, Math.max(0, totalH - listH)));
  // Zone de clip pour le scroll
  ctx.save();
  ctx.beginPath(); ctx.rect(rulesX, listY0, (isLS?rulesW:CANVAS_W)-rulesX, listH); ctx.clip();
  ctx.textAlign='left';
  RULES.forEach((r,i)=>{
    const y = listY0 + i*lH - introScrollY;
    if(y+lH < listY0 || y > listY0+listH) return; // hors vue
    if(i%2===0){ ctx.fillStyle='rgba(14,42,58,.45)'; ctx.fillRect(rulesX,y,isLS?rulesW-16:CANVAS_W-rulesX*2,lH-2); }
    ctx.font=`${fs(TXT.ruleIcon)}px serif`; ctx.textBaseline='top'; ctx.fillStyle='#fff'; ctx.fillText(r.icon,rulesX+2,y+padV);
    ctx.font=`bold ${fs(TXT.ruleTitle)}px Orbitron`; ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=4;
    ctx.fillText(r.title,rulesX+34,y+padV); ctx.shadowBlur=0;
    ctx.font=`${fs(TXT.ruleBody)}px "Share Tech Mono"`; ctx.fillStyle='#90b4c4';
    wrapText(r.text, rulesX+34, y+padV+fs(22), isLS?rulesW-54:CANVAS_W-64, fs(14));
  });
  ctx.restore();
  // Indicateur de scroll si nécessaire
  if(totalH > listH){
    const trackH=listH-8, knobH=Math.max(20,trackH*listH/totalH);
    const knobY=listY0+4+(trackH-knobH)*(introScrollY/Math.max(1,totalH-listH));
    const tx=isLS?rulesW-8:CANVAS_W-rulesX-8;
    ctx.fillStyle='#0e2a3a'; ctx.fillRect(tx,listY0+4,4,trackH);
    ctx.fillStyle='#00e5ff55'; ctx.beginPath(); ctx.roundRect?ctx.roundRect(tx,knobY,4,knobH,2):ctx.rect(tx,knobY,4,knobH); ctx.fill();
    // Aide "défiler"
    ctx.font=`${fs(9)}px "Share Tech Mono"`; ctx.fillStyle='#2a4a5e';
    ctx.textAlign='center';
    ctx.fillText('↕ défiler', isLS?rulesW/2:CANVAS_W/2, rulesY0+rulesYH-(isLS?fs(32):fs(24)));
  }

  /* ── PANNEAU PERSONNAGE ─────────────────────────
     Paysage : colonne droite    Portrait : bande du haut PX,PY,PW,PH */
  const panX = isLS ? rulesW   : PX;
  const panY = isLS ? 0        : PY;
  const panW = isLS ? CANVAS_W-rulesW : PW;
  const panH = isLS ? CANVAS_H : PH;

  ctx.fillStyle='#050d18'; ctx.fillRect(panX,panY,panW,panH);
  if(isLS){
    ctx.strokeStyle='#0d2535'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(panX,panY+16); ctx.lineTo(panX,panY+panH-16); ctx.stroke();
  } else {
    ctx.strokeStyle='#0d2535'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(panX+16,panY+panH); ctx.lineTo(panX+panW-16,panY+panH); ctx.stroke();
  }

  /* Boutons — calculés d'abord pour positionner le personnage correctement */
  const btnW   = isLS ? 220 : panW*0.56-14;
  const btnH   = fs(isLS?36:28);
  const btnGap = fs(isLS?4:4);
  const nBtns  = 3;
  const btnsH  = nBtns*btnH + (nBtns-1)*btnGap;
  const btnAreaX = isLS ? panX+panW/2-btnW/2 : panX+10;
  const btnMarginBottom = fs(10);
  const btnAreaY = isLS
    ? panY + panH - btnsH - btnMarginBottom  // toujours dans le panneau
    : panY+8;
  const fsLabel  = isIOS ? '📱  PLEIN ÉCRAN' : (document.fullscreenElement ? '⛶  FENÊTRÉ' : '⛶  PLEIN ÉCRAN');

  /* Personnage : centré dans l'espace disponible AU-DESSUS des boutons */
  const charAreaH = isLS ? (btnAreaY - panY - fs(30)) : panH; // hauteur dispo pour le perso
  const charSize  = isLS ? Math.min(1.0, charAreaH/140) : 0.52;
  const charX     = isLS ? panX+panW/2 : panX+panW*0.78;
  const charY     = isLS ? panY + charAreaH/2 + fs(10) : panY+panH/2;
  drawCharacter(charX, charY, tickleTimer>0?'tickle':'neutral', charSize);

  /* Badge difficulté bien visible — sous le personnage */
  const dcfgBadge = DIFF_CONFIG[difficulty];
  const badgeY = isLS
    ? charY + charSize*44 + fs(18)  // juste sous le personnage (rayon ≈ 44*size)
    : panY + panH*0.72;
  const badgeX = isLS ? panX+panW/2 : panX+panW*0.78;

  // Fond coloré
  const badgeW = isLS ? btnW+24 : btnW+10;
  const badgeH = fs(36);
  ctx.save();
  ctx.fillStyle   = dcfgBadge.col+'28';
  ctx.strokeStyle = dcfgBadge.col;
  ctx.lineWidth   = 2;
  ctx.shadowColor = dcfgBadge.col; ctx.shadowBlur = 10;
  // Rounded rect fallback
  const bRX = badgeX-badgeW/2, bRY = badgeY-badgeH/2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bRX, bRY, badgeW, badgeH, 6);
  else              ctx.rect(bRX, bRY, badgeW, badgeH);
  ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;

  // Label "DIFFICULTÉ"
  ctx.font=`${fs(9)}px "Share Tech Mono"`; ctx.fillStyle='#4a7a96';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('DIFFICULTÉ', badgeX, badgeY-fs(8));

  // Nom du niveau en grand et coloré
  ctx.font=`bold ${fs(15)}px Orbitron`; ctx.fillStyle=dcfgBadge.col;
  ctx.shadowColor=dcfgBadge.col; ctx.shadowBlur=8;
  ctx.fillText(dcfgBadge.name.toUpperCase(), badgeX, badgeY+fs(6));
  ctx.shadowBlur=0; ctx.restore();

  /* Sous-texte paysage */
  if(isLS){
    ctx.font=`${fs(9)}px "Share Tech Mono"`; ctx.fillStyle='#2a4a5e'; ctx.textAlign='center';
    ctx.fillText('Modifier dans ⚙ Réglages', panX+panW/2, btnAreaY-fs(10));
  }

  canvasBtn('startBtn',         '▶  COMMENCER',  btnAreaX, btnAreaY,                  btnW, btnH, {primary:true});
  canvasBtn('settingsBtn',      '⚙  RÉGLAGES',   btnAreaX, btnAreaY+(btnH+btnGap),    btnW, btnH);
  if(!isIOS){
    canvasBtn('fullscreenIntrBtn', fsLabel, btnAreaX, btnAreaY+(btnH+btnGap)*2, btnW, btnH);
    rects.fullscreenIntrBtn = {x:btnAreaX, y:btnAreaY+(btnH+btnGap)*2, w:btnW, h:btnH, action:'fullscreen'};
  }
}

/* ════════════════════════════════════════════════
   §19  ÉCRAN DE FIN — score décoré par difficulté

   Facile   → rose + bébé mignon
   Normal   → bleu + soleil et ciel
   Difficile→ rouge + flammes animées
   ════════════════════════════════════════════════ */
function drawScoreDecoration(x, y, scoreText){
  const dcfg = DIFF_CONFIG[difficulty];
  ctx.save();

  if(difficulty==='hard'){
    /* ── Flammes ── */
    const flames=10;
    for(let i=0;i<flames;i++){
      const ang   = (i/flames)*Math.PI*2 + frameTime*.04;
      const dist  = 90+18*Math.sin(frameTime*.07+i*1.3);
      const fx    = x+Math.cos(ang)*dist, fy=y+Math.sin(ang)*dist;
      const h     = 28+10*Math.sin(frameTime*.09+i);
      const grad  = ctx.createRadialGradient(fx,fy+h*.5,0, fx,fy,h);
      grad.addColorStop(0,'#fff176'); grad.addColorStop(.4,'#ff6d00'); grad.addColorStop(1,'rgba(183,28,28,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(fx-8,fy+h); ctx.quadraticCurveTo(fx-12,fy,fx,fy-h); ctx.quadraticCurveTo(fx+12,fy,fx+8,fy+h);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowColor='#f44336'; ctx.shadowBlur=30;
    ctx.font=`bold ${fs(30)}px Orbitron`; ctx.fillStyle='#f44336';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(scoreText, x, y);
    // Badge "DIFFICILE"
    ctx.shadowBlur=0; ctx.font=`bold ${fs(11)}px Orbitron`; ctx.fillStyle='#ff6d00';
    ctx.fillText('☠ DIFFICILE ☠', x, y+fs(26));

  } else if(difficulty==='normal'){
    /* ── Soleil + ciel ── */
    const rays=14;
    const rayStart=72, rayEnd=106;
    for(let i=0;i<rays;i++){
      const ang=(i/rays)*Math.PI*2 + frameTime*.02;
      const len=rayEnd - rayStart + 8*Math.sin(frameTime*.05+i);
      ctx.strokeStyle=`rgba(66,165,245,${.35+.25*Math.sin(ang*2)})`;
      ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(x+Math.cos(ang)*rayStart, y+Math.sin(ang)*rayStart);
      ctx.lineTo(x+Math.cos(ang)*(rayStart+len), y+Math.sin(ang)*(rayStart+len));
      ctx.stroke();
    }
    ctx.shadowColor='#42a5f5'; ctx.shadowBlur=20;
    ctx.font=`bold ${fs(30)}px Orbitron`; ctx.fillStyle='#42a5f5';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(scoreText, x, y);
    ctx.shadowBlur=0; ctx.font=`bold ${fs(11)}px Orbitron`; ctx.fillStyle='#64b5f6';
    ctx.fillText('☀ NORMAL ☀', x, y+fs(26));

  } else {
    /* ── Bébé mignon (facile) ── */
    const hearts=['💕','✨','🌸','⭐','💖','🎀'];
    hearts.forEach((h,i)=>{
      const ang=(i/hearts.length)*Math.PI*2 + frameTime*.03;
      const hx=x+Math.cos(ang)*88, hy=y+Math.sin(ang)*78;
      ctx.font=`${fs(18)}px serif`; ctx.textBaseline='middle'; ctx.textAlign='center';
      ctx.fillText(h, hx, hy);
    });
    ctx.shadowColor='#f48fb1'; ctx.shadowBlur=20;
    ctx.font=`bold ${fs(30)}px Orbitron`; ctx.fillStyle='#f48fb1';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(scoreText, x, y);
    ctx.shadowBlur=0; ctx.font=`bold ${fs(11)}px Orbitron`; ctx.fillStyle='#f8bbd0';
    ctx.fillText('🌸 FACILE 🌸', x, y+fs(26));
  }

  ctx.restore();
}

function drawOverlay(){
  if(gameState!==STATE.OVER) return;
  ctx.save(); ctx.fillStyle='rgba(4,12,20,.91)'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  const isLS=layoutMode==='landscape';
  const tW=isLS?540:CANVAS_W;
  const info=GAME_OVER_TEXT[overReason]||GAME_OVER_TEXT.ammo;
  const dcfg=DIFF_CONFIG[difficulty];

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${fs(TXT.overlayTitle)}px Orbitron`; ctx.fillStyle=info.col;
  ctx.shadowColor=info.col; ctx.shadowBlur=26; ctx.fillText(info.title,tW/2,fs(75)); ctx.shadowBlur=0;
  ctx.font=`${fs(TXT.overlaySub)}px "Share Tech Mono"`; ctx.fillStyle='#90b4c4'; ctx.fillText(info.sub,tW/2,fs(110));
  if(overReason==='victory'){
    ctx.font=`${fs(11)}px "Share Tech Mono"`; ctx.fillStyle='#7aacbc';
    ctx.fillText(`Bonus temps: +${timeBonus}   Munitions ×${ammo} ×${dcfg.multi} = +${Math.round(ammo*dcfg.ammoBonus*dcfg.multi)}`,tW/2,fs(136));
  }

  /* Score décoré selon la difficulté */
  const moodleNote = calcNote();
  drawScoreDecoration(tW/2, fs(192), `SCORE : ${score}`);
  /* Note Moodle estimée */
  ctx.font=`bold ${fs(TXT.overlayNote)}px Orbitron`; ctx.fillStyle='#00e5ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='#00e5ff'; ctx.shadowBlur=8;
  ctx.fillText(`NOTE MOODLE : ${moodleNote} / ${dcfg.moodleCap}`, tW/2, fs(228));
  ctx.shadowBlur=0;
  /* Confirmation d'enregistrement */
  ctx.font=`${fs(10)}px "Share Tech Mono"`; ctx.fillStyle='#4caf50';
  ctx.fillText('✓ Score enregistré automatiquement dans Moodle', tW/2, fs(244));

  ctx.strokeStyle='#1a3040'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(tW/2-160,fs(244)); ctx.lineTo(tW/2+160,fs(244)); ctx.stroke();

  /* Phrase pédagogique centrée — fixée une fois à la fin de partie */
  const lessonMaxW = Math.min(420, tW - 40);
  ctx.font=`${fs(TXT.overlayLesson)}px "Share Tech Mono"`; ctx.fillStyle='#7aacbc';
  ctx.textAlign='center'; ctx.textBaseline='top';
  wrapText(currentLesson, tW/2, fs(250), lessonMaxW, fs(16));

  /* ── Boutons fin de partie ─────────────────────────────────────────
     Colonne gauche (220px) : Rejouer · Partager · Réglages · Plein écran
     Bloc droite (à côté du bouton Partager) : 📷 Exporter le score        */
  const bBtnH  = fs(32), bBtnGap = fs(4);
  const bBtnX  = tW/2-110;
  /* Ancrer les boutons depuis le bas en laissant une marge */
  const nMainBtns  = 4;
  const stackH     = nMainBtns*bBtnH + (nMainBtns-1)*bBtnGap;
  const bBtnY      = Math.max(fs(290), CANVAS_H - stackH - fs(16));

  const fsLabelOver = isIOS ? '📱  PLEIN ÉCRAN' : (document.fullscreenElement ? '⛶  FENÊTRÉ' : '⛶  PLEIN ÉCRAN');
  canvasBtn('replayBtn',        '↺  REJOUER',   bBtnX, bBtnY,                       220, bBtnH);
  canvasBtn('shareBtn',         '⬆  PARTAGER',  bBtnX, bBtnY+(bBtnH+bBtnGap),      220, bBtnH);
  canvasBtn('settingsBtn',      '⚙  RÉGLAGES',  bBtnX, bBtnY+(bBtnH+bBtnGap)*2,    220, bBtnH);
  if(!isIOS){
    canvasBtn('fullscreenOverBtn', fsLabelOver, bBtnX, bBtnY+(bBtnH+bBtnGap)*3, 220, bBtnH);
    rects.fullscreenOverBtn = {x:bBtnX, y:bBtnY+(bBtnH+bBtnGap)*3, w:220, h:bBtnH, action:'fullscreen'};
  }

  /* 📷 Bouton "Exporter votre score" — à droite du bouton Partager */
  const camX   = bBtnX+220+fs(8);
  const camY   = bBtnY+(bBtnH+bBtnGap);
  const camW   = fs(80);
  const camH   = bBtnH*2+bBtnGap;  // même hauteur que le bloc Partager+gap
  ctx.save();
  ctx.shadowColor='#4caf50'; ctx.shadowBlur=10;
  ctx.strokeStyle='#4caf50'; ctx.lineWidth=1.5;
  ctx.fillStyle='rgba(76,175,80,.10)';
  ctx.fillRect(camX,camY,camW,camH); ctx.strokeRect(camX,camY,camW,camH);
  ctx.shadowBlur=0;
  /* Icône appareil photo */
  ctx.font=`${fs(22)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#4caf50'; ctx.fillText('📷', camX+camW/2, camY+camH*.36);
  /* Texte sur 2 lignes */
  ctx.font=`${fs(9)}px "Share Tech Mono"`; ctx.fillStyle='#4caf50';
  ctx.fillText('Exportez', camX+camW/2, camY+camH*.65);
  ctx.fillText('votre score', camX+camW/2, camY+camH*.80);
  ctx.restore();
  rects.camBtn={x:camX,y:camY,w:camW,h:camH};

  /* Panel de partage fallback — s'ouvre à gauche des boutons */
  if(sharePanel.visible){
    const netBtns   = sharePanel.btns;
    const spBtnH    = fs(32), spBtnGap = fs(3);
    const spTotalH  = netBtns.length*(spBtnH+spBtnGap);
    // S'afficher à gauche si possible, sinon à droite, jamais hors écran
    const spXLeft = bBtnX - fs(8) - 220;
    const spX = spXLeft >= fs(10) ? spXLeft : bBtnX + 220 + fs(8);
    const spTotalHCalc = netBtns.length*(spBtnH+spBtnGap);
    // Ancrer le panel pour qu'il ne déborde jamais en bas
    const rawSpY = bBtnY + (bBtnH+bBtnGap) - 2;
    const spY = (rawSpY + spTotalHCalc + 12 > CANVAS_H)
      ? Math.max(fs(10), CANVAS_H - spTotalHCalc - 12)
      : rawSpY;
    ctx.fillStyle='rgba(4,12,20,.96)'; ctx.fillRect(spX-4,spY-4,228,spTotalH+8);
    ctx.strokeStyle='#00e5ff'; ctx.lineWidth=1; ctx.strokeRect(spX-4,spY-4,228,spTotalH+8);
    // Clip the panel to canvas height
    ctx.save();
    ctx.beginPath(); ctx.rect(fs(4), fs(4), CANVAS_W-fs(8), CANVAS_H-fs(8)); ctx.clip();
    netBtns.forEach((b,i)=>{
      const by=spY+i*(spBtnH+spBtnGap);
      ctx.fillStyle=b.color+'18'; ctx.fillRect(spX,by,220,spBtnH);
      ctx.strokeStyle=b.color; ctx.lineWidth=1; ctx.strokeRect(spX,by,220,spBtnH);
      ctx.font=`bold ${fs(11)}px Orbitron`; ctx.fillStyle=b.color;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.label, spX+110, by+spBtnH/2+1);
      rects['share_'+i]={x:spX,y:by,w:220,h:spBtnH,url:b.url};
    });
    ctx.restore();
    sharePanel.h=spTotalH;
  }

  if(isLS){
    const rx=560, charMood=overReason==='victory'?'happy':'sad';
    drawCharacter(rx+(CANVAS_W-rx)/2, CANVAS_H/2, charMood, 1.1);
    ctx.font=`${fs(10)}px "Share Tech Mono"`; ctx.fillStyle='#4a7a96'; ctx.textAlign='center';
    ctx.fillText(overReason==='victory'?'Mission accomplie !':'Système dépassé.', rx+(CANVAS_W-rx)/2, CANVAS_H/2+92);
  }
  ctx.restore();
}

/* ════════════════════════════════════════════════
   §19b  SYSTÈME DE PARTAGE

   Stratégie :
   1. navigator.share() → feuille native OS (mobile, Chrome, Edge, Safari)
   2. Si non supporté ou refusé → panel de boutons directs (X, WhatsApp,
      LinkedIn, Facebook + copier dans presse-papier)
   Ces liens directs fonctionnent partout y compris dans les iframes Moodle.
   ════════════════════════════════════════════════ */
const sharePanel = { visible:false, btns:[], h:0 };

function buildShareText(){
  const dcfg = DIFF_CONFIG[difficulty];
  const note = Math.min(dcfg.moodleCap, Math.round(score/dcfg.rawMax*dcfg.moodleCap));
  const emoji = overReason==='victory' ? '✅' : '🦠';
  const action = overReason==='victory'
    ? `J'ai éliminé l'infection bactérienne en mode ${dcfg.name} !`
    : `J'ai affronté les bactéries résistantes en mode ${dcfg.name}.`;
  return `${emoji} ${action}\n\n🏆 Score : ${score} pts — Note : ${note}/${dcfg.moodleCap}\n\n💡 Saviez-vous que l'antibiorésistance tue déjà 700 000 personnes par an dans le monde ?\n\n#Antibiorésistance #SantéPublique #JeuSérieux`;
}

/* Génère une image de score partageable sur un canvas off-screen */
function buildScoreImage(cb){
  const W=600, H=340;
  const oc=document.createElement('canvas'); oc.width=W; oc.height=H;
  const ox=oc.getContext('2d');
  const dcfg=DIFF_CONFIG[difficulty];
  const note=Math.min(dcfg.moodleCap, Math.round(score/dcfg.rawMax*dcfg.moodleCap));
  const win=overReason==='victory';

  /* Fond = capture du canvas de jeu redimensionnée */
  try{
    ox.drawImage(canvas, 0, 0, W, H);
    // Assombrir pour lisibilité du texte
    ox.fillStyle='rgba(4,8,20,0.70)'; ox.fillRect(0,0,W,H);
  }catch(_){
    const bg=ox.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#04080f'); bg.addColorStop(1,'#071420');
    ox.fillStyle=bg; ox.fillRect(0,0,W,H);
  }

  /* Bordure */
  ox.strokeStyle=win?'#4caf50':'#f44336';
  ox.lineWidth=3; ox.strokeRect(4,4,W-8,H-8);

  /* Titre */
  ox.font='bold 26px "Orbitron", monospace';
  ox.fillStyle=win?'#4caf50':'#f44336';
  ox.textAlign='center'; ox.textBaseline='middle';
  ox.shadowColor=win?'#4caf50':'#f44336'; ox.shadowBlur=16;
  ox.fillText(win?'✅ INFECTION ÉLIMINÉE':'🦠 PARTIE TERMINÉE', W/2, 52);
  ox.shadowBlur=0;

  /* Score & difficulté */
  ox.font='bold 56px "Orbitron", monospace';
  ox.fillStyle='#00e5ff'; ox.shadowColor='#00e5ff'; ox.shadowBlur=18;
  ox.fillText(score+' pts', W/2, 145); ox.shadowBlur=0;

  ox.font='16px "Share Tech Mono", monospace';
  ox.fillStyle='#7aacbc';
  ox.fillText(`Mode ${dcfg.name.toUpperCase()}  ·  Note : ${note} / ${dcfg.moodleCap}`, W/2, 195);

  /* Déco — petits cercles couleur bactérie */
  ['#f44336','#2196f3','#4caf50','#ffeb3b','#ab47bc'].forEach((col,i)=>{
    const x=40+i*60, y=H-68;
    ox.fillStyle=col; ox.shadowColor=col; ox.shadowBlur=8;
    ox.beginPath(); ox.arc(x,y,14,0,Math.PI*2); ox.fill(); ox.shadowBlur=0;
  });

  /* Message pédagogique */
  ox.font='13px "Share Tech Mono", monospace';
  ox.fillStyle='#4a7a96'; ox.textAlign='center';
  ox.fillText('Jeu de sensibilisation à l\'antibiorésistance', W/2, H-40);
  ox.fillText('#Antibiorésistance  #SantéPublique  #JeuSérieux', W/2, H-20);

  oc.toBlob(cb, 'image/png');
}

async function doShare(){
  const text = buildShareText();

  /* Tente d'inclure une image (screenshot score) */
  async function tryShareWithImage(blob){
    const file = new File([blob], 'score-systeme-immunitaire.png', {type:'image/png'});
    const data = {
      title: 'Système Immunitaire — Jeu d\'antibiothérapie',
      text,
      files: [file]
    };
    if(navigator.share && navigator.canShare && navigator.canShare(data)){
      try{ await navigator.share(data); sharePanel.visible=false; return true; }
      catch(e){ if(e.name==='AbortError') return true; }
    }
    return false;
  }

  /* Tente partage texte seul */
  async function tryShareTextOnly(){
    const data = { title:'Système Immunitaire — Jeu d\'antibiothérapie', text };
    if(navigator.share){
      try{ await navigator.share(data); sharePanel.visible=false; return true; }
      catch(e){ if(e.name==='AbortError') return true; }
    }
    return false;
  }

  /* 1. Essai avec image */
  const imgShared = await new Promise(res=>{
    buildScoreImage(async blob=>{
      if(blob){ res(await tryShareWithImage(blob)); } else res(false);
    });
  });
  if(imgShared) return;

  /* 2. Essai texte seul */
  if(await tryShareTextOnly()) return;

  /* 3. Fallback : panel boutons + téléchargement image */
  const enc = encodeURIComponent(text);
  const page= encodeURIComponent(typeof location!=='undefined'?location.href:'');
  /* Note: l'image n'est disponible que via le partage natif (mobile Chrome/Safari).
     Les liens de partage web ne supportent pas les images arbitraires sans URL hébergée. */
  sharePanel.btns=[
    { label:'𝕏 Twitter / X',    color:'#00e5ff', url:`https://twitter.com/intent/tweet?text=${enc}` },
    { label:'WhatsApp',          color:'#00e5ff', url:`https://web.whatsapp.com/send?text=${enc}` },
    { label:'LinkedIn',          color:'#00e5ff', url:`https://www.linkedin.com/feed/?shareActive=true&text=${enc}` },
    { label:'📋 Copier le texte', color:'#7aacbc', url:'__copy__' },
  ];
  sharePanel.h = sharePanel.btns.length*(fs(34)+fs(4));
  sharePanel.visible=true;
}

function handleSharePanelClick(cx,cy){
  if(!sharePanel.visible) return false;
  for(let i=0;i<sharePanel.btns.length;i++){
    const r=rects['share_'+i];
    if(r && pointInRect(cx,cy,r)){
      if(r.url==='__copy__'){
        navigator.clipboard?.writeText(buildShareText()).catch(()=>{});
        sharePanel.visible=false;
        addFloat(CANVAS_W/2, CANVAS_H/2, '📋 Copié !', '#00e5ff');
      } else if(r.url==='__img__'){
        buildScoreImage(blob=>{
          if(!blob) return;
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a'); a.href=url;
          a.download='score-systeme-immunitaire.png'; a.click();
          setTimeout(()=>URL.revokeObjectURL(url),5000);
        });
        sharePanel.visible=false;
        addFloat(CANVAS_W/2, CANVAS_H/2, '📸 Image téléchargée !', '#00e5ff');
      } else {
        window.open(r.url,'_blank','noopener,noreferrer');
      }
      return true;
    }
  }
  sharePanel.visible=false;
  return false;
}

/* ════════════════════════════════════════════════
   §20  PANNEAU RÉGLAGES (sur canvas, modale)
   ════════════════════════════════════════════════ */
function drawSettings(){
  const pW=460, pH=490, pX=(CANVAS_W-pW)/2, pY=(CANVAS_H-pH)/2;
  ctx.save();
  ctx.fillStyle='rgba(4,12,20,.95)'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.shadowColor='#00e5ff'; ctx.shadowBlur=16;
  ctx.strokeStyle='#00e5ff'; ctx.lineWidth=1.5; ctx.strokeRect(pX,pY,pW,pH); ctx.shadowBlur=0;
  ctx.fillStyle='#06121e'; ctx.fillRect(pX,pY,pW,pH);

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${fs(TXT.settingsTitle)}px Orbitron`; ctx.fillStyle='#00e5ff';
  ctx.shadowColor='#00e5ff'; ctx.shadowBlur=8; ctx.fillText('⚙  RÉGLAGES',pX+pW/2,pY+fs(26)); ctx.shadowBlur=0;

  function sep(y){ ctx.strokeStyle='#0e2a3a'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pX+16,y); ctx.lineTo(pX+pW-16,y); ctx.stroke(); }

  sep(pY+fs(44));

  const canChange = gameState===STATE.INTRO;
  let gy = pY+fs(60);
  ctx.textAlign='left'; ctx.font=`${fs(10)}px "Share Tech Mono"`; ctx.fillStyle='#5a8faa';
  ctx.fillText('DIFFICULTÉ'+(canChange?'':' (hors partie)'), pX+24, gy);
  gy += fs(18);
  const diffBtns=[{k:'easy',lbl:'FACILE'},{ k:'normal',lbl:'NORMAL'},{k:'hard',lbl:'DIFFICILE'}];
  diffBtns.forEach(({k,lbl},i)=>{
    const bx=pX+22+i*142, bh=fs(34), bw=134;
    const active=difficulty===k, dis=!canChange;
    const col=DIFF_CONFIG[k].col;
    ctx.save(); ctx.globalAlpha=dis?.35:1;
    ctx.strokeStyle=active?col:'#1a3a50'; ctx.lineWidth=active?2:1;
    ctx.fillStyle=active?col.replace(')',', .15)').replace('rgb','rgba'):'rgba(5,15,26,.6)';
    // fallback fill
    ctx.fillStyle=active?'rgba(0,0,0,.0)':'rgba(5,15,26,.6)';
    ctx.fillRect(bx,gy,bw,bh);
    if(active){ ctx.fillStyle=col; ctx.globalAlpha=dis?.1:.18; ctx.fillRect(bx,gy,bw,bh); ctx.globalAlpha=dis?.35:1; }
    ctx.strokeRect(bx,gy,bw,bh);
    ctx.font=`${active?'bold ':''} ${fs(10)}px Orbitron`;
    ctx.fillStyle=active?col:'#37647a'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(lbl, bx+bw/2, gy+bh/2-4);
    ctx.font=`${fs(8)}px "Share Tech Mono"`; ctx.fillStyle='#3a6880';
    ctx.fillText('max '+DIFF_CONFIG[k].moodleCap+'/100 · ×'+DIFF_CONFIG[k].multi+'pts', bx+bw/2, gy+bh/2+8);
    ctx.restore();
    rects['diff_'+k]={x:bx,y:gy,w:bw,h:bh,disabled:dis};
  });
  gy += fs(34)+fs(10);

  sep(gy); gy+=fs(14);

  /* ── SLIDERS ── */
  function drawSlider(label, value, id, y){
    ctx.textAlign='left'; ctx.font=`${fs(10)}px "Share Tech Mono"`; ctx.fillStyle='#5a8faa';
    ctx.fillText(label, pX+24, y);
    ctx.textAlign='right'; ctx.fillStyle='#90b4c4';
    ctx.fillText(Math.round(value*100)+'%', pX+pW-20, y);
    const tX=pX+24, tY=y+fs(18), tW=pW-50, tH=fs(8);
    ctx.fillStyle='#0e2a3a'; ctx.fillRect(tX,tY,tW,tH);
    ctx.fillStyle='#00e5ff'; ctx.fillRect(tX,tY,tW*value,tH);
    const hx=tX+tW*value, hy=tY+tH/2;
    ctx.shadowColor='#00e5ff'; ctx.shadowBlur=8;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(hx,hy,fs(8),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    rects[id+'Track']={x:tX, y:tY-fs(10), w:tW, h:tH+fs(20)};
  }
  drawSlider('EFFETS SONORES', sfxVolume,   'sfx',   gy);  gy+=fs(54);
  drawSlider('MUSIQUE',        musicVolume, 'music', gy);  gy+=fs(54);

  sep(gy); gy+=fs(10);

  canvasBtn('settingsClose','✕  FERMER', pX+(pW-140)/2, gy, 140, fs(38));
  ctx.restore();
}

/* ════════════════════════════════════════════════
   §21  ÉCRAN ROTATION PORTRAIT
   ════════════════════════════════════════════════ */
function isDevicePortrait(){ return window.innerHeight > window.innerWidth*1.15; }
function drawPortraitHint(){
  ctx.save(); ctx.fillStyle='rgba(4,12,20,.96)'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`${fs(60)}px serif`; ctx.fillStyle='#fff'; ctx.fillText('📱',CANVAS_W/2,CANVAS_H/2-48);
  ctx.font=`bold ${fs(18)}px Orbitron`; ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=12;
  ctx.fillText('TOURNEZ VOTRE ÉCRAN',CANVAS_W/2,CANVAS_H/2+fs(22)); ctx.shadowBlur=0;
  ctx.font=`${fs(11)}px "Share Tech Mono"`; ctx.fillStyle='#7aacbc';
  ctx.fillText('Ou activez le mode Portrait dans Réglages',CANVAS_W/2,CANVAS_H/2+fs(50));
  canvasBtn('settingsBtn','⚙  RÉGLAGES', CANVAS_W/2-80, CANVAS_H/2+fs(78), 160, fs(38));

}

/* ════════════════════════════════════════════════
   §22  LOGIQUE DE JEU
   ════════════════════════════════════════════════ */
function rollNextColor(){ const pool=[...new Set(bacteria.filter(b=>b.alive).map(b=>b.ci))]; if(!pool.length)return; selCol=pool[Math.floor(Math.random()*pool.length)]; }
function spawnAll(){ bacteria=Array.from({length:N_BACT},()=>new Bacteria()); }

function shoot(){
  if(gameState!==STATE.PLAYING||ammo<=0||cooldown>0||settingsOpen) return;
  resumeAC();
  const angle=Math.atan2(mouseY-CY,mouseX-CX);
  const ox=CX+Math.cos(angle)*(R_CANON+L_CANON+6), oy=CY+Math.sin(angle)*(R_CANON+L_CANON+6);
  projectiles.push(new Projectile(ox,oy,angle,selCol));
  ammo--; cooldown=12; SFX.shoot(); rollNextColor();
}

function tickTimer(){
  if(gameState!==STATE.PLAYING) return;
  const dcfg=DIFF_CONFIG[difficulty];
  remaining=Math.max(0, dcfg.duration-(Date.now()-startTime)/1000);
  timeBonus=Math.max(0, Math.round(remaining*(dcfg.timeBonusStart/dcfg.duration)));
  const sec=Math.ceil(remaining);
  if(remaining<=10 && sec!==lastTickSec){ SFX.tick(); lastTickSec=sec; }
  if(remaining<=0) triggerGameOver('time');
  Music.tick(remaining, dcfg.duration);
}

/* Calcul de la note Moodle — source unique de vérité */
function calcNote(){
  const d=DIFF_CONFIG[difficulty];
  return Math.min(d.moodleCap, Math.round(score / d.rawMax * d.moodleCap));
}

function triggerGameOver(reason){
  if(gameState===STATE.OVER) return;
  gameState=STATE.OVER; overReason=reason;
  currentLesson = pickLesson(false);
  Music.stop();
  if(reason==='superbug') SFX.superBug(); else SFX.gameOver();
  SCORM.finish(calcNote());
  announce('Défaite. '+((GAME_OVER_TEXT[reason]||{}).sub||''));
}

function checkVictory(){
  if(gameState!==STATE.PLAYING) return;
  if(!bacteria.some(b=>b.alive)){
    const dcfg=DIFF_CONFIG[difficulty];
    gameState=STATE.OVER; victory=true; overReason='victory';
    currentLesson = pickLesson(true);
    /* Bonus de fin ajouté AVANT le calcul de la note */
    score += Math.round((ammo*dcfg.ammoBonus + timeBonus) * dcfg.multi);
    Music.stop(); SFX.victory();
    SCORM.finish(calcNote());
    announce(`Victoire ! Score : ${score} — Note : ${calcNote()}/${dcfg.moodleCap}`);
  }
}
function checkGameOver(){
  if(gameState!==STATE.PLAYING) return;
  if(ammo<=0 && projectiles.length===0 && bacteria.some(b=>b.alive)) triggerGameOver('ammo');
}

/* Retour à l'écran d'accueil (sans réinitialiser la partie) */
function goToIntro(){
  Music.stop();
  gameState = STATE.INTRO;
  rects.startBtn  = null;
  rects.replayBtn = null;
  sharePanel.visible = false;
  introScrollY = 0;
}

function startGame(){
  resumeAC().then(()=>SFX.start());
  SCORM.init();
  const dcfg = DIFF_CONFIG[difficulty];
  bacteria=[];projectiles=[];particles=[];floatTexts=[];
  score=0; ammo=dcfg.ammo; cooldown=0; victory=false; overReason='';
  remaining=dcfg.duration;
  timeBonus=dcfg.timeBonusStart;
  lastTickSec=dcfg.duration+1;
  startTime=Date.now(); rects.startBtn=null; rects.replayBtn=null;
  gameState=STATE.PLAYING; spawnAll(); rollNextColor();
  setTimeout(()=>{ if(gameState===STATE.PLAYING) Music.start(); }, 700);
  announce('Partie démarrée en mode '+dcfg.name+'. Visez les bactéries et cliquez pour tirer.');
}

/* ════════════════════════════════════════════════
   §23  BOUCLE PRINCIPALE
   ════════════════════════════════════════════════ */
function update(){
  frameTime++;
  if(tickleTimer>0) tickleTimer--;
  if(gameState!==STATE.PLAYING) return;
  if(keys['ArrowLeft']||keys['a']||keys['A']) cannonAng-=ROT_SPEED;
  if(keys['ArrowRight']||keys['d']||keys['D']) cannonAng+=ROT_SPEED;
  if(rotDir!==0) cannonAng+=rotDir*ROT_SPEED;
  if(keys['ArrowLeft']||keys['ArrowRight']||keys['a']||keys['A']||keys['d']||keys['D']||rotDir!==0){mouseX=CX+Math.cos(cannonAng)*200;mouseY=CY+Math.sin(cannonAng)*200;}
  else cannonAng=Math.atan2(mouseY-CY,mouseX-CX);
  if(cooldown>0) cooldown--;
  for(const b of bacteria) b.update();
  bacteriaBacteriaInteractions();
  bacteria=bacteria.filter(b=>!b.done);
  for(const p of projectiles) p.update();
  projectiles=projectiles.filter(p=>p.alive);
  tickParticles(); tickFloats(); tickTimer(); checkVictory(); checkGameOver();
}

function render(){
  drawBackground();
  if(settingsOpen){ drawSettings(); return; }
  if(gameState===STATE.INTRO){ drawIntro(); return; }
  drawBoard(); drawPanel();
  drawTrajectory(); drawBacteria(); drawProjectiles(); drawParticles(); drawFloats(); drawCannon();
  if(gameState===STATE.OVER) drawOverlay();
}

function loop(){ update(); render(); requestAnimationFrame(loop); }

/* ════════════════════════════════════════════════
   §24  GESTION DES INTERACTIONS
   ════════════════════════════════════════════════ */
function applySlider(id, cx){
  const tr=rects[id+'Track']; if(!tr) return;
  const v=clamp((cx-tr.x)/tr.w, 0, 1);
  if(id==='sfx'){   sfxVolume=v;   sfxGain.gain.value=sfxVolume; }
  if(id==='music'){ musicVolume=v; Music.setVolume(v); }
}

function handleSettingsClick(cx,cy){
  if(pointInRect(cx,cy,rects.settingsClose)){ settingsOpen=false; return; }
  // Difficulté (hors partie uniquement)
  if(gameState===STATE.INTRO){
    for(const k of Object.keys(DIFF_CONFIG)){
      if(pointInRect(cx,cy,rects['diff_'+k])){ difficulty=k; return; }
    }
  }

  if(pointInRect(cx,cy,rects.sfxTrack)){   applySlider('sfx',cx);   return; }
  if(pointInRect(cx,cy,rects.musicTrack)){ applySlider('music',cx); return; }
}

function handleMainClick(cx,cy){
  resumeAC();
  // Panel partage (priorité car il peut être par-dessus d'autres boutons)
  if(sharePanel.visible && handleSharePanelClick(cx,cy)) return;

  // Chatouille le personnage si on clique dessus
  if(charLastRect && pointInRect(cx,cy,charLastRect)){
    tickleTimer = 90; // ~1.5 s
    SFX.tickle();
    addFloat(charLastRect.x+charLastRect.w/2, charLastRect.y-10, 'Ouh !', '#9ec8e8');
    return;
  }
  // Boutons plein écran (intro, fin, panneau jeu)
  for(const key of ['fullscreenIntrBtn','fullscreenOverBtn','panelFullscreen']){
    if(rects[key] && pointInRect(cx,cy,rects[key])){
      if(isIOS){
        addFloat(CANVAS_W/2, CANVAS_H/2-20, '📱 Sur iOS : appuyez ⎙ puis "Écran accueil"', '#00e5ff');
      } else {
        document.fullscreenElement
          ? document.exitFullscreen().catch(()=>{})
          : document.documentElement.requestFullscreen().catch(()=>{});
      }
      return;
    }
  }
  if(pointInRect(cx,cy,rects.settingsBtn)||pointInRect(cx,cy,rects.panelSettings)){ settingsOpen=true; return; }
  if(gameState===STATE.INTRO && pointInRect(cx,cy,rects.startBtn)){  startGame(); return; }
  if(gameState===STATE.OVER  && pointInRect(cx,cy,rects.replayBtn)){ goToIntro(); return; }
  if(gameState===STATE.OVER  && pointInRect(cx,cy,rects.shareBtn)){  doShare();   return; }
  if(gameState===STATE.OVER  && pointInRect(cx,cy,rects.camBtn)){
    buildScoreImage(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url;
      a.download='score-systeme-immunitaire.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    });
    addFloat(CANVAS_W/2, CANVAS_H/2-40, '📷 Image téléchargée !', '#4caf50');
    return;
  }
  shoot();
}

/* Souris */
canvas.addEventListener('mousedown',e=>{
  const{x,y}=toCanvasCoords(e.clientX,e.clientY); wasSliderDrag=false;
  if(settingsOpen){
    if(pointInRect(x,y,rects.sfxTrack)){   draggingSlider='sfx';   wasSliderDrag=true; applySlider('sfx',x); }
    if(pointInRect(x,y,rects.musicTrack)){ draggingSlider='music'; wasSliderDrag=true; applySlider('music',x); }
  }
});
canvas.addEventListener('mousemove',e=>{
  const{x,y}=toCanvasCoords(e.clientX,e.clientY); mouseX=x; mouseY=y;
  if(draggingSlider) applySlider(draggingSlider,x);
});
canvas.addEventListener('mouseup',()=>{ draggingSlider=null; });
canvas.addEventListener('click',e=>{

  if(wasSliderDrag){ wasSliderDrag=false; return; }
  const{x,y}=toCanvasCoords(e.clientX,e.clientY);
  if(settingsOpen){ handleSettingsClick(x,y); return; }
  handleMainClick(x,y);
});

/* Clavier */
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();if(gameState===STATE.INTRO)startGame();else shoot();}
  if((e.key==='r'||e.key==='R')&&!settingsOpen){
    if(gameState===STATE.OVER) goToIntro(); else if(gameState===STATE.INTRO) startGame();
  }
  if(e.key==='Escape'&&settingsOpen) settingsOpen=false;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') e.preventDefault();
});
document.addEventListener('keyup',e=>{ keys[e.key]=false; });

/* Touch */
/* ── Touch handlers ─────────────────────────────────────────────────
   Stratégie :
   • touchstart → déclenche IMMÉDIATEMENT boutons et tir (réponse rapide)
   • touchmove  → met à jour la visée + scroll intro + sliders
   • touchend   → libère les sliders
   Le tir/bouton sur touchstart est la méthode la plus fiable sur mobile.
   ─────────────────────────────────────────────────────────────────── */
let _touchStartX=0, _touchStartY=0;

canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); resumeAC();
  const t = e.changedTouches[0];
  _touchStartX = t.clientX;
  _touchStartY = t.clientY;
  const{x,y} = toCanvasCoords(t.clientX, t.clientY);
  mouseX=x; mouseY=y;
  introTouchStartY = t.clientY;

  /* Sliders (réglages) */
  if(settingsOpen){
    if(pointInRect(x,y,rects.sfxTrack)){   draggingSlider='sfx';   wasSliderDrag=true; applySlider('sfx',x);   return; }
    if(pointInRect(x,y,rects.musicTrack)){ draggingSlider='music'; wasSliderDrag=true; applySlider('music',x); return; }
    handleSettingsClick(x,y); return;
  }
  /* Boutons et tir — sur touchstart pour une réponse immédiate */
  handleMainClick(x,y);
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  const{x,y} = toCanvasCoords(t.clientX, t.clientY);
  mouseX=x; mouseY=y;
  if(draggingSlider) applySlider(draggingSlider,x);
  /* Scroll intro uniquement si le doigt glisse verticalement */
  if(gameState===STATE.INTRO && !settingsOpen && !draggingSlider){
    const r = canvas.getBoundingClientRect();
    const dy = introTouchStartY - t.clientY;
    introScrollY += dy * (canvas.height / r.height);
    introTouchStartY = t.clientY;
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  draggingSlider=null; wasSliderDrag=false;
},{passive:false});

/* Plein écran — géré via les boutons canvas uniquement */
document.addEventListener('fullscreenchange', applyScale);

/* Garantit l'envoi du score SCORM à la fermeture de la page.
   visibilitychange retiré — trop agressif sur mobile (veille = session tuée). */
window.addEventListener('beforeunload', ()=>{ SCORM.terminate(); });

/* ════════════════════════════════════════════════
   §25  LANCEMENT
   ════════════════════════════════════════════════ */
syncHtmlTextScale();
gameState = STATE.INTRO;
// Attendre le premier rendu DOM avant de calculer l'échelle,
// pour que offsetHeight des éléments HTML soit disponible
requestAnimationFrame(() => { applyScale(); loop(); });
</script>
